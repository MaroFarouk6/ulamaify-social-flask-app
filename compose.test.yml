name: ulamaify-social-manager-tests
services:
  postgres-test:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: social_manager_tests
      POSTGRES_USER: test_owner
      # Isolated disposable network; no host port; no real content or credentials.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    networks: [test-only]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_owner -d social_manager_tests"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_POSTGRES_URL: postgresql+psycopg://test_owner@postgres-test:5432/social_manager_tests
    networks: [test-only]
    depends_on:
      postgres-test:
        condition: service_healthy
networks:
  test-only:
    internal: true
